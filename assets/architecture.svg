    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .suspended { animation: suspension 14s ease-in-out infinite; }
      .trace { stroke-dasharray: 28 310; animation: transmission 16s linear infinite; }
      .particle { animation: luminance 7s ease-in-out infinite; }
      .delayed { animation-delay: -3s; }
      @keyframes suspension { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes transmission { to { stroke-dashoffset: -676; } }
      @keyframes luminance { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

